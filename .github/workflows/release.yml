name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-linux:
    name: Build & Release (Linux)
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Environment & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ qt6-base-dev qt6-declarative-dev libqt6svg6-dev libgl1-mesa-dev

      - name: Extract Version
        id: extract_version
        run: |
          # Try to get version from tag if triggered by tag
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            # Fallback version or get from CMakeLists etc.
            VERSION=$(grep -i "project(ZiliumSuperCompactor VERSION" CMakeLists.txt | grep -o "[0-9.]*" | head -1)
            [ -z "$VERSION" ] && VERSION="1.0.0"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Detected version: $VERSION"

      - name: Build the Project
        run: |
          chmod +x build.sh
          ./build.sh --release --gui --package

      - name: Locate Package
        id: locate_package
        run: |
          PACKAGE_FILE=$(ls dist/zilium-super-compactor-*.tar.gz | head -n 1)
          SHA_FILE=$(ls dist/zilium-super-compactor-*.tar.gz.sha256 | head -n 1)
          echo "PACKAGE_FILE=$PACKAGE_FILE" >> $GITHUB_ENV
          echo "SHA_FILE=$SHA_FILE" >> $GITHUB_ENV
          PACKAGE_NAME=$(basename "$PACKAGE_FILE")
          echo "PACKAGE_NAME=$PACKAGE_NAME" >> $GITHUB_ENV
          
          # Read SHA256 sum for release body
          SHA_VAL=$(cat "$SHA_FILE" | cut -d' ' -f1)
          echo "APP_SHA256=$SHA_VAL" >> $GITHUB_ENV

      - name: Generate Changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"* %s (%h)" --no-merges)
          else
            CHANGELOG=$(git log ${PREV_TAG}..HEAD --pretty=format:"* %s (%h)" --no-merges)
          fi
          echo "RELEASE_BODY<<EOF" >> $GITHUB_ENV
          echo "## Changelog" >> $GITHUB_ENV
          echo "$CHANGELOG" >> $GITHUB_ENV
          echo "" >> $GITHUB_ENV
          echo "### Checksums" >> $GITHUB_ENV
          echo "* **Linux (tar.gz)**: \`${{ env.APP_SHA256 }}\`" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ env.VERSION }}
          name: Zilium Super Compactor v${{ env.VERSION }}
          files: |
            ${{ env.PACKAGE_FILE }}
            ${{ env.SHA_FILE }}
          body: ${{ env.RELEASE_BODY }}

  build-windows:
    name: Build & Release (Windows)
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Qt (Qt6)
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.5.0'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          dir: ${{ runner.temp }}/qt

      - name: Extract Version
        id: extract_version
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION=$(grep -i "project(ZiliumSuperCompactor VERSION" CMakeLists.txt | grep -o "[0-9.]*" | head -1)
            [ -z "$VERSION" ] && VERSION="1.0.0"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Detected version: $VERSION"

      - name: Build the Project (Windows)
        shell: cmd
        run: |
          call build-windows.bat --release --gui --package --qt-path %Qt6_DIR%

      - name: Locate Package
        id: locate_package
        shell: bash
        run: |
          PACKAGE_FILE=$(ls dist/zilium-windows-v*.zip | head -n 1)
          MD5_FILE=$(ls dist/zilium-windows-v*.md5 | head -n 1)
          echo "PACKAGE_FILE=$PACKAGE_FILE" >> $GITHUB_ENV
          echo "MD5_FILE=$MD5_FILE" >> $GITHUB_ENV
          PACKAGE_NAME=$(basename "$PACKAGE_FILE")
          echo "PACKAGE_NAME=$PACKAGE_NAME" >> $GITHUB_ENV
          
          # Read MD5 sum for release body (skip header line from certutil)
          MD5_VAL=$(sed -n '2p' "$MD5_FILE" | tr -d '\r')
          echo "APP_MD5=$MD5_VAL" >> $GITHUB_ENV

      - name: Generate Append Body
        shell: bash
        run: |
          echo "APPEND_BODY<<EOF" >> $GITHUB_ENV
          echo "* **Windows (zip) MD5**: \`${{ env.APP_MD5 }}\`" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Update Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ env.VERSION }}
          files: |
            ${{ env.PACKAGE_FILE }}
            ${{ env.MD5_FILE }}
          append_body: true
          body: ${{ env.APPEND_BODY }}
